aid: genie
name: Genie
description: >-
  Genie is an open source, full-stack web framework for the Julia programming
  language, developed by the Barcelona-based company Genie (backed by
  Speedinvest) to let data scientists and R&D engineers turn Julia models,
  simulations, and analyses into production-ready, data-centric web apps, APIs,
  and interactive dashboards. The framework has three core components: Genie.jl
  for backend routing and REST APIs, Stipple.jl for low-code reactive UIs, and
  SearchLight.jl as the database ORM, plus first-party authentication and
  authorization plugins and Genie Builder, a VS Code extension with a
  drag-and-drop UI builder and AI assistant. It is used to build data
  exploration dashboards, financial data products, ML/AI and simulation apps,
  bioinformatics tools, and internal tooling. Distributed as MIT-licensed Julia
  packages via the Julia General registry.
